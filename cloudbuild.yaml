steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/paragraf:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/paragraf:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'paragraf'
      - '--image=europe-north1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/paragraf:$COMMIT_SHA'
      - '--region=europe-north1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=120'

images:
  - 'europe-north1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/paragraf:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
